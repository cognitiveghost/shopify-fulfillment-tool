<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analysis Results</title>
<!-- gui/results_bridge.py writes theme_css_vars() over the marker before the
     page loads, then results.js keeps it current from the bridge. -->
<style id="theme-vars">/* theme-vars */</style>
<link rel="stylesheet" href="../../shared/web/kit.css">
<link rel="stylesheet" href="results.css">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="../../shared/web/page.js" defer></script>
<script src="columns.js" defer></script>
<script src="pane.js" defer></script>
<script src="bulk.js" defer></script>
<script src="results.js" defer></script>
</head>
<body>
<main id="results">
  <section id="kpis" class="card kpis" data-i18n-attr="aria-label" aria-label="Session numbers"></section>

  <div id="filterbar" class="filterbar">
    <label class="input search">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0zM21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" data-i18n-attr="placeholder,aria-label" placeholder="Order, customer or SKU"
             aria-label="Search orders" autocomplete="off" spellcheck="false">
    </label>
    <label class="search-mode">
      <input id="search-prefix" type="checkbox" autocomplete="off">
      <span data-i18n>Starts with</span>
    </label>
    <div id="filter-anchor" class="menu-anchor">
      <button id="add-filter" class="btn dashed" type="button"
              aria-haspopup="menu" aria-expanded="false"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg><span data-i18n>Add filter</span></button>
      <div id="filter-menu" class="menu" role="menu" hidden></div>
    </div>
    <div id="chips" class="chips"></div>
    <button id="clear-all" class="btn ghost" type="button" data-i18n hidden>Clear all</button>
    <span class="spacer"></span>
    <span id="count" class="count"></span>
    <div id="columns-anchor" class="menu-anchor">
      <button id="columns-button" class="btn ghost" type="button"
              aria-haspopup="dialog" aria-expanded="false" disabled></button>
      <div id="columns-panel" class="popover columns-panel" role="dialog" data-i18n-attr="aria-label" aria-label="Columns" hidden></div>
    </div>
    <button id="screen-menu" class="btn ghost icon" type="button" data-i18n-attr="title,aria-label"
            title="More actions for this screen" aria-label="More actions for this screen">⋯</button>
    <button id="export" class="btn primary" type="button" disabled></button>
  </div>

  <section id="table-area" class="card split" data-slot="none">
    <div class="table-wrap">
      <div id="selection-bar" class="selection-bar" role="toolbar" data-i18n-attr="aria-label"
           aria-label="Actions for the checked orders" hidden>
        <span id="selection-count" class="selection-count" aria-live="polite"></span>
        <button id="selection-mark" class="btn secondary compact" type="button"></button>
        <button id="selection-hold" class="btn secondary compact" type="button"></button>
        <div class="menu-anchor">
          <button id="selection-more" class="btn secondary compact" type="button"
                  aria-haspopup="menu" aria-expanded="false" data-i18n>More</button>
          <div id="selection-menu" class="menu" role="menu" hidden></div>
        </div>
      </div>
      <div id="table" class="table" role="grid" tabindex="0" data-i18n-attr="aria-label" aria-label="Orders" data-visible-rows="0">
        <div id="scroller" class="scroller">
          <div id="header" class="row header" role="row"></div>
          <div id="rows" class="rows" role="rowgroup"></div>
        </div>
      </div>
      <div id="results-empty" class="state" hidden>
        <p class="state-title" data-i18n>Nothing analysed yet</p>
        <p class="state-text" data-i18n>Load the orders and stock files in Setup, then run the analysis. Every order it finds lands here.</p>
      </div>
      <div id="results-no-match" class="state" hidden>
        <svg class="state-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0zM21 21l-4.3-4.3M13.5 8.5l-5 5M8.5 8.5l5 5"/></svg>
        <p class="state-title" data-i18n>No orders match</p>
        <p id="no-match-text" class="state-text"></p>
        <button id="no-match-clear" class="btn secondary" type="button" data-i18n>Clear filters</button>
      </div>
    </div>
    <div id="slot" class="slot">
      <aside id="pane" class="pane" data-i18n-attr="aria-label" aria-label="Order detail" hidden></aside>
      <div id="pane-strip" class="pane-strip" hidden>
        <button id="pane-show" class="pane-rail" type="button" data-i18n-attr="aria-label,title"
                aria-label="Show order detail" title="Show detail"><span class="pane-rail-label" data-i18n>Order detail</span></button>
      </div>
    </div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text" class="toast-text"></span>
    <span id="toast-badge" class="toast-badge" hidden></span>
    <button id="toast-undo" class="toast-action" type="button" data-i18n hidden>Undo</button>
    <button id="toast-dismiss" class="toast-close" type="button" data-i18n-attr="aria-label,title" aria-label="Dismiss" title="Dismiss"></button>
  </div>
</main>
</body>
</html>
