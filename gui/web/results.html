<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analysis Results</title>
<!-- gui/results_bridge.py writes theme_css_vars() over the marker before the
     page loads, then results.js keeps it current from the bridge. -->
<style id="theme-vars">/* theme-vars */</style>
<link rel="stylesheet" href="results.css">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="columns.js" defer></script>
<script src="pane.js" defer></script>
<script src="bulk.js" defer></script>
<script src="results.js" defer></script>
</head>
<body>
<main id="results">
  <section id="kpis" class="kpis" aria-label="Session numbers"></section>

  <div id="filterbar" class="filterbar">
    <input id="search" type="search" placeholder="Order, customer or SKU"
           aria-label="Search orders" autocomplete="off" spellcheck="false">
    <div id="chips" class="chips"></div>
    <div id="filter-anchor" class="menu-anchor">
      <button id="add-filter" class="btn ghost" type="button"
              aria-haspopup="menu" aria-expanded="false">Add filter</button>
      <div id="filter-menu" class="menu" role="menu" hidden></div>
    </div>
    <button id="clear-all" class="btn ghost" type="button" hidden>Clear all</button>
    <span class="spacer"></span>
    <span id="count" class="count"></span>
    <button id="columns-button" class="btn ghost" type="button" aria-pressed="false" disabled>Columns</button>
    <button id="screen-menu" class="btn ghost icon" type="button"
            title="More actions for this screen" aria-label="More actions for this screen">⋯</button>
    <button id="export" class="btn primary" type="button" disabled>Export</button>
  </div>

  <section id="table-area" class="table-area" data-slot="none">
    <div class="table-wrap">
      <div id="selection-bar" class="selection-bar" role="toolbar"
           aria-label="Actions for the selected orders" hidden>
        <div class="selection-counts">
          <span id="selection-count" class="selection-count" aria-live="polite"></span>
          <span id="selection-sub" class="selection-sub"></span>
        </div>
        <span class="spacer"></span>
        <button id="selection-mark" class="btn primary" type="button"></button>
        <button id="selection-hold" class="btn secondary" type="button"></button>
        <div class="menu-anchor">
          <button id="selection-more" class="btn ghost" type="button"
                  aria-haspopup="menu" aria-expanded="false">More</button>
          <div id="selection-menu" class="menu" role="menu" hidden></div>
        </div>
        <span class="selection-separator" role="presentation"></span>
        <button id="selection-exclude" class="btn danger" type="button">Exclude from run</button>
        <button id="selection-clear" class="btn ghost" type="button">Clear</button>
      </div>
      <div id="table" class="table" role="grid" tabindex="0" aria-label="Orders" data-visible-rows="0">
        <div id="scroller" class="scroller">
          <div id="header" class="row header" role="row"></div>
          <div id="rows" class="rows" role="rowgroup"></div>
        </div>
      </div>
      <div id="results-empty" class="state" hidden>
        <p class="state-title">Nothing analysed yet</p>
        <p class="state-text">Load the orders and stock files in Setup, then run the analysis. Every order it finds lands here.</p>
      </div>
      <div id="results-no-match" class="state" hidden>
        <p class="state-title">No orders match</p>
        <p class="state-text">Remove a filter or clear the search.</p>
        <button id="no-match-clear" class="btn ghost" type="button">Clear all</button>
      </div>
    </div>
    <div id="slot" class="slot">
      <aside id="pane" class="pane" aria-label="Order detail" hidden></aside>
      <div id="pane-strip" class="pane-strip" hidden>
        <button id="pane-show" class="btn ghost icon strip-button" type="button"
                aria-label="Show the pane" title="Show the pane"></button>
      </div>
      <aside id="columns-panel" class="columns-panel" aria-label="Columns" hidden></aside>
    </div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text" class="toast-text"></span>
    <span id="toast-badge" class="toast-badge" hidden></span>
    <button id="toast-undo" class="btn ghost" type="button" hidden>Undo</button>
  </div>
</main>
</body>
</html>
